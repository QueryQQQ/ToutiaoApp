# Ruff 的规则配置。
# 只有 [tool.ruff] 段，没有 [project] 段，不影响 pip 安装行为。
# 作用：把规则固定进文件，不再依赖 VSCode 扩展的默认值，换机器 / 换同学电脑结果都一致。

[tool.ruff]
target-version = "py314"
line-length = 120
exclude = [
    ".venv",
    "__pycache__",
    "_backup_20261104",
    "_backup_20261106_imports",
    "xwzx-news",
]

[tool.ruff.lint]
select = [
    "E4",  # 导入相关的基础错误
    "E7",  # 语句层面的错误
    "E9",  # 语法/运行时会崩的错误
    "F",   # Pyflakes：未使用的变量和导入、未定义的名字
    "I",   # isort：import 排序与分组
    "UP",  # pyupgrade：用新语法替代老写法（Optional[str] -> str | None）
    "B",   # bugbear：容易写出 bug 的写法
]

[tool.ruff.lint.flake8-bugbear]
# FastAPI 的 Depends()/Query() 写在参数默认值里是官方写法，不是 bug，放行
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.Header",
    "fastapi.Cookie",
    "fastapi.Form",
    "fastapi.File",
]

[tool.ruff.lint.isort]
# 告诉 Ruff 哪些是本项目自己的模块，避免被误判成第三方而排错位置
known-first-party = ["config", "crud", "models", "routers", "schemas", "utils"]
